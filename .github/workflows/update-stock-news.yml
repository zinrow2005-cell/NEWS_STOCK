name: Update Taiwan stock news

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - stock-news.json
      - market-close.json
  schedule:
    # GitHub Actions cron is UTC. 00/30 each hour from 06:00 to 23:30 Taiwan time on weekdays,
    # plus a few weekend refreshes for corporate/market news.
    - cron: "0,30 22-23,0-15 * * 1-5"
    - cron: "15 1,5,9,13 * * 0,6"

permissions:
  contents: write

concurrency:
  group: update-stock-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test parser and stock matching
        run: python scripts/selftest_news_pipeline.py
      - name: Fetch public finance RSS feeds
        run: python scripts/update_stock_news.py
      - name: Validate non-empty stock news
        run: python scripts/validate_stock_news.py
      - name: Commit news data when changed
        run: |
          if git diff --quiet -- stock-news.json; then
            echo "No stock-news.json changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-news.json
          git commit -m "chore: update Taiwan stock news"
          git push
